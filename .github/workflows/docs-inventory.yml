name: docs-inventory

on:
  push:
    branches: [ pc_port ]
    paths:
      - '**.md'
      - 'docs/**'
      - 'tools/scripts/**'
      - '.github/workflows/docs-inventory.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'tools/scripts/**'
      - '.github/workflows/docs-inventory.yml'
  workflow_dispatch:

concurrency:
  group: docs-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    name: Check documentation tooling and deterministic inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate inventory script syntax
        run: python3 -c "import ast; from pathlib import Path; ast.parse(Path('tools/scripts/repo_inventory.py').read_text(encoding='utf-8'))"

      - name: Generate the inventory twice and compare
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/repo_inventory.py --revision HEAD --limit 10 > "$RUNNER_TEMP/inventory-1.json"
          python3 tools/scripts/repo_inventory.py --revision HEAD --limit 10 > "$RUNNER_TEMP/inventory-2.json"
          cmp "$RUNNER_TEMP/inventory-1.json" "$RUNNER_TEMP/inventory-2.json"
          python3 - "$RUNNER_TEMP/inventory-1.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)

          assert report["schema_version"] == 1
          assert len(report["revision"]) == 40
          assert report["summary"]["blob_files"] > 0
          assert report["summary"]["blob_bytes"] >= 0
          assert len(report["largest_files"]) <= 10
          print("Inventory schema and deterministic output verified:", report["summary"])
          PY

      - name: Upload metadata-only inventory report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: repository-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/inventory-1.json
          retention-days: 14
