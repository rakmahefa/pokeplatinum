name: build_win

on:
  push:
    branches: [ pc_port ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Supersede obsolete builds when a newer commit arrives on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Build and artifact-upload jobs do not need write access to repository contents.
permissions:
  contents: read

env:
  GITHUB_ACTIONS: "true"

jobs:
  build_win:
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install MSys2
        run: .\Install_MSys2.ps1
        shell: powershell

      - name: Build (win64)
        run: .\Launch_Msys2.ps1 "make win64"
        shell: powershell

      - name: Package release artifact (win64)
        run: .\Launch_Msys2.ps1 ./tools/scripts/package_artifacts_win64.sh
        shell: powershell

      - name: Upload release artifact (win64)
        uses: actions/upload-artifact@v6
        with:
          name: release_win64
          path: build_win64/pokeplatinum/release_win64